# Tokyo Night: a blue-purple dark theme (common in nvim and terminals)
# Palette: night from https://github.com/folke/tokyonight.nvim (background #1a1b26)

[palette]
fg = "#c0caf5"
fg_dark = "#a9b1d6"
# Faint gray: text and the background mixed half and half. Dimmer than secondary text, for what
# does not work here (settings rows, help sections)
faint = "#6d738e"
terminal_black = "#414868"
bg_highlight = "#292e42"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
yellow = "#e0af68"
# Dim yellow: yellow and the background (bg #1a1b26) mixed 7:3. Still reads as yellow,
# but darker than the selected week's number
dim_yellow = "#a58354"
orange = "#ff9e64"
red = "#f7768e"
magenta = "#bb9af7"
# Multi-day bars: cyan and the background (bg #1a1b26) mixed 3:7. A tinted band, dark enough for text on it
dim_cyan = "#385167"
# Selection background: magenta and the background (bg #1a1b26) mixed 3:7. A light purple that stands out
# from the background (also a translucent one), dark enough for text on it
dim_magenta = "#4a4165"
# Dragged-over text in the day popup: blue (#7aa2f7) and the background (bg #1a1b26) mixed 4:6. Lighter than
# the selection background, so it shows on the chosen row too
mid_blue = "#40517a"

[roles]
text = "fg"
muted = "fg_dark"
line = "terminal_black"
year_line = "blue"
label = "blue"
week_number = "yellow"
week_number_dim = "dim_yellow"
weekend = "cyan"
today = "green"
selected = "red"
selection = "dim_magenta"
text_selection = "mid_blue"
focus = "magenta"
checked = "magenta"
notice = "yellow"
error = "red"
grid = "bg_highlight"
other_month = "faint"
# Multi-day bars in the month grid: a tinted band
range = "dim_cyan"
# Layout 1's calendar: the underline where two or more multi-day items overlap (the !! color)
range_overlap = "orange"
# Priorities (!!! / !! / !): red, orange, yellow
priority_high = "red"
priority_medium = "orange"
priority_low = "yellow"
help_section = "cyan"
help_key = "orange"
