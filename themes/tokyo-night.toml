# Tokyo Night: a blue-purple dark theme (common in nvim and terminals)
# Palette: night from https://github.com/folke/tokyonight.nvim (background #1a1b26)

[palette]
fg = "#c0caf5"
fg_dark = "#a9b1d6"
comment = "#565f89"
terminal_black = "#414868"
bg_highlight = "#292e42"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
yellow = "#e0af68"
# Dim yellow: yellow and the background (bg #1a1b26) mixed 7:3. Still reads as yellow,
# but darker than the selected week's number
dim_yellow = "#a58354"
orange = "#ff9e64"
red = "#f7768e"
magenta = "#bb9af7"

[roles]
text = "fg"
muted = "fg_dark"
line = "terminal_black"
year_line = "blue"
label = "blue"
week_number = "yellow"
week_number_dim = "dim_yellow"
weekend = "cyan"
has_item = "orange"
holiday = "red"
today = "green"
selected = "red"
cursor_line = "bg_highlight"
focus = "magenta"
checked = "magenta"
notice = "yellow"
error = "red"
grid = "bg_highlight"
other_month = "comment"
help_section = "cyan"
help_key = "orange"
