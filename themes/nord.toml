# Nord: a cool, low-contrast dark theme (arctic blue-grays; available for most editors and terminals)
# Palette: nord0-nord15 from https://www.nordtheme.com (background: nord0 #2e3440)

[palette]
nord1 = "#3b4252"
nord2 = "#434c5e"
nord3 = "#4c566a"
nord4 = "#d8dee9"
# Light gray: nord4 and the background mixed 7:3. Fainter than normal text, for secondary text
nord4_dim = "#a5abb6"
nord8 = "#88c0d0"
nord9 = "#81a1c1"
nord11 = "#bf616a"
nord12 = "#d08770"
nord13 = "#ebcb8b"
# Dim yellow: nord13 (yellow) and the background mixed 7:3. Still reads as yellow,
# but darker than the selected week's number
nord13_dim = "#b29e74"
nord14 = "#a3be8c"
nord15 = "#b48ead"

[roles]
text = "nord4"
muted = "nord4_dim"
line = "nord3"
year_line = "nord8"
label = "nord8"
week_number = "nord13"
week_number_dim = "nord13_dim"
weekend = "nord9"
has_item = "nord12"
holiday = "nord11"
today = "nord14"
selected = "nord11"
cursor_line = "nord1"
focus = "nord15"
checked = "nord15"
notice = "nord13"
error = "nord11"
grid = "nord1"
other_month = "nord3"
# Multi-day bars in the month grid: a step lighter than the selected row
range = "nord2"
help_section = "nord9"
help_key = "nord12"
