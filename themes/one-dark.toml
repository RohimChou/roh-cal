# One Dark: Atom's dark theme (also VS Code's One Dark Pro and many editors and terminals)
# Palette: from https://github.com/joshdick/onedark.vim (background #282c34)

[palette]
foreground = "#abb2bf"
# Light gray: foreground and the background mixed 7:3. Fainter than normal text, for secondary text
fg_dim = "#848a95"
# Faint gray: text and the background mixed half and half. Dimmer than secondary text, for what
# does not work here (settings rows, help sections)
faint = "#6a6f7a"
gutter_fg_grey = "#4b5263"
# Month grid lines between days: One Dark's special_grey (#3b4048) and the background mixed 6:4, close to the
# background, so the line where a month ends (gutter_fg_grey) stands out from them
grid_grey = "#333840"
red = "#e06c75"
# High priority (!!!): red with more light (same hue), so it stands out on the background
bright_red = "#e5858d"
green = "#98c379"
yellow = "#e5c07b"
# Dim yellow: yellow and the background mixed 7:3. Still reads as yellow,
# but darker than the selected week's number
dim_yellow = "#ac9466"
# Orange
dark_yellow = "#d19a66"
blue = "#61afef"
purple = "#c678dd"
cyan = "#56b6c2"
# Multi-day bars: cyan and the background mixed 3:7. A tinted band, dark enough for text on it
dim_cyan = "#36555f"
# Every other line of stacked multi-day bars: cyan and the background mixed 4:6. A step lighter than
# dim_cyan, so two bars on lines next to each other read as two
mid_cyan = "#3a636d"
# Selection background: purple and the background mixed 3:7. A light purple that stands out
# from the background (also a translucent one), dark enough for text on it
dim_purple = "#574367"
# Dragged-over text in the day popup: blue (#61afef) and the background (#282c34) mixed 35:65. Less blue than
# in the other themes (35:65): the text is dimmer here and must stay readable on it; still lighter than the
# selection background
mid_blue = "#3c5a75"

[roles]
text = "foreground"
muted = "fg_dim"
line = "gutter_fg_grey"
year_line = "cyan"
label = "cyan"
week_number = "yellow"
week_number_dim = "dim_yellow"
weekend = "blue"
today = "green"
selected = "red"
selection = "dim_purple"
text_selection = "mid_blue"
focus = "purple"
checked = "purple"
notice = "yellow"
error = "red"
# Month grid lines between days: faint, well below the month's edge (line)
grid = "grid_grey"
other_month = "faint"
# Multi-day bars in the month grid: a tinted band
range = "dim_cyan"
# Every other line of stacked bars (the 2nd, 4th…): a step lighter, so bars next to each other read as two
range_alt = "mid_cyan"
# Layout 1's calendar: the underline where two or more multi-day items overlap (the !! color)
range_overlap = "dark_yellow"
# Priorities (!!! / !! / !): red, orange, yellow
priority_high = "bright_red"
priority_medium = "dark_yellow"
priority_low = "yellow"
help_section = "blue"
help_key = "dark_yellow"
