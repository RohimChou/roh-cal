# Dracula: a high-contrast dark theme leaning purple and pink (available for most editors and terminals)
# Palette: the Color Palette on https://draculatheme.com (background: Background #282a36)

[palette]
foreground = "#f8f8f2"
# Light gray: text and background mixed 7:3. Fainter than normal text, for secondary text
fg_dim = "#bababa"
# Faint gray: text and the background mixed half and half. Dimmer than secondary text, for what
# does not work here (settings rows, help sections)
faint = "#909194"
comment = "#6272a4"
current_line = "#44475a"
cyan = "#8be9fd"
green = "#50fa7b"
yellow = "#f1fa8c"
# Dim yellow: yellow and the background mixed 7:3. Still reads as yellow,
# but darker than the selected week's number
dim_yellow = "#b5bc72"
orange = "#ffb86c"
red = "#ff5555"
# High priority (!!!): red with more light (same hue), so it stands out on the background
bright_red = "#ff7474"
pink = "#ff79c6"
purple = "#bd93f9"
# Multi-day bars: cyan and the background mixed 3:7. A tinted band, dark enough for text on it
dim_cyan = "#466372"
# Selection background: purple and the background (Background #282a36) mixed 3:7. A light purple that stands out
# from the background (also a translucent one), dark enough for text on it
dim_purple = "#554a71"
# Dragged-over text in the day popup: cyan (#8be9fd) and the background (Background #282a36) mixed 4:6.
# Lighter than the selection background, so it shows on the chosen row too
mid_cyan = "#507686"
# The background the colors above are made for (roh-cal does not paint it)
background = "#282a36"

[roles]
text = "foreground"
muted = "fg_dim"
line = "comment"
year_line = "purple"
label = "purple"
week_number = "yellow"
week_number_dim = "dim_yellow"
weekend = "cyan"
today = "green"
selected = "red"
selection = "dim_purple"
text_selection = "mid_cyan"
# The tab bar's glow fades into the background
background = "background"
focus = "pink"
checked = "pink"
notice = "yellow"
error = "red"
grid = "current_line"
other_month = "faint"
# Multi-day bars in the month grid: a tinted band
range = "dim_cyan"
# Every other line of stacked bars (the 2nd, 4th…): a step lighter, so bars next to each other read as two
range_alt = "mid_cyan"
# Layout 1's calendar: the underline where two or more multi-day items overlap (the !! color)
range_overlap = "orange"
# Priorities (!!! / !! / !): red, orange, yellow
priority_high = "bright_red"
priority_medium = "orange"
priority_low = "yellow"
help_section = "cyan"
help_key = "orange"
