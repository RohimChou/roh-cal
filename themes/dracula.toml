# Dracula: a high-contrast dark theme leaning purple and pink (available for most editors and terminals)
# Palette: the Color Palette on https://draculatheme.com (background: Background #282a36)

[palette]
foreground = "#f8f8f2"
# Light gray: text and background mixed 7:3. Fainter than normal text, for secondary text
fg_dim = "#bababa"
comment = "#6272a4"
current_line = "#44475a"
cyan = "#8be9fd"
green = "#50fa7b"
yellow = "#f1fa8c"
# Dim yellow: yellow and the background mixed 7:3. Still reads as yellow,
# but darker than the selected week's number
dim_yellow = "#b5bc72"
orange = "#ffb86c"
red = "#ff5555"
pink = "#ff79c6"
purple = "#bd93f9"
# Multi-day bars: cyan and the background mixed 3:7. A tinted band, dark enough for text on it
dim_cyan = "#466372"
# Selection background: purple and the background (Background #282a36) mixed 3:7. A light purple that stands out
# from the background (also a translucent one), dark enough for text on it
dim_purple = "#554a71"

[roles]
text = "foreground"
muted = "fg_dim"
line = "comment"
year_line = "purple"
label = "purple"
week_number = "yellow"
week_number_dim = "dim_yellow"
weekend = "cyan"
today = "green"
selected = "red"
cursor_line = "dim_purple"
focus = "pink"
checked = "pink"
notice = "yellow"
error = "red"
grid = "current_line"
other_month = "comment"
# Multi-day bars in the month grid: a tinted band
range = "dim_cyan"
# Priorities (!!! / !! / !): red, orange, yellow
priority_high = "red"
priority_medium = "orange"
priority_low = "yellow"
help_section = "cyan"
help_key = "orange"
