# Catppuccin Mocha: soft colors for a dark background (same as v1's default)
# Palette: mocha from https://catppuccin.com/palette
#
# [palette] is this theme's palette (name the colors as you like); [roles] says which color each
# on-screen role uses:
# a palette name, or a color itself ("#rrggbb", a terminal 16-color name like "blue" or "dark-gray",
# or a 256-color number)

[palette]
text = "#cdd6f4"
subtext0 = "#a6adc8"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
lavender = "#b4befe"
blue = "#89b4fa"
green = "#a6e3a1"
yellow = "#f9e2af"
# Dim yellow: yellow and the background (base #1e1e2e) mixed 7:3. Still reads as yellow,
# but darker than the selected week's number
dim_yellow = "#b7a788"
peach = "#fab387"
red = "#f38ba8"
mauve = "#cba6f7"

[roles]
text = "text"
muted = "subtext0"
line = "surface2"
year_line = "lavender"
label = "lavender"
week_number = "yellow"
week_number_dim = "dim_yellow"
weekend = "blue"
has_item = "peach"
holiday = "red"
today = "green"
selected = "red"
cursor_line = "surface0"
focus = "mauve"
checked = "mauve"
notice = "yellow"
error = "red"
# Grid lines and other months: same as v1
grid = "surface0"
other_month = "overlay0"
# Multi-day bars in the month grid: a step lighter than the selected row
range = "surface1"
# Help page: same as v1
help_section = "blue"
help_key = "peach"
