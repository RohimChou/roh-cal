# Catppuccin Mocha: soft colors for a dark background (same as v1's default)
# Palette: mocha from https://catppuccin.com/palette
#
# [palette] is this theme's palette (name the colors as you like); [roles] says which color each
# on-screen role uses:
# a palette name, or a color itself ("#rrggbb", a terminal 16-color name like "blue" or "dark-gray",
# or a 256-color number)

[palette]
text = "#cdd6f4"
subtext0 = "#a6adc8"
# Faint gray: text and the background mixed half and half. Dimmer than secondary text, for what
# does not work here (settings rows, help sections)
faint = "#767a91"
surface2 = "#585b70"
surface0 = "#313244"
lavender = "#b4befe"
blue = "#89b4fa"
green = "#a6e3a1"
yellow = "#f9e2af"
# Dim yellow: yellow and the background (base #1e1e2e) mixed 7:3. Still reads as yellow,
# but darker than the selected week's number
dim_yellow = "#b7a788"
peach = "#fab387"
red = "#f38ba8"
mauve = "#cba6f7"
# Multi-day bars: sapphire (#74c7ec) and the background (base #1e1e2e) mixed 3:7. A tinted band, dark enough for text on it
dim_sapphire = "#385167"
# Every other line of stacked multi-day bars: sapphire and the background mixed 4:6. A step lighter than
# dim_sapphire, so two bars on lines next to each other read as two
mid_sapphire = "#40627a"
# Selection background: mauve (#cba6f7) and the background (base #1e1e2e) mixed 3:7. A light purple that stands out
# from the background (also a translucent one), dark enough for text on it
dim_mauve = "#52476a"
# Dragged-over text in the day popup: blue (#89b4fa) and the background (base #1e1e2e) mixed 4:6. Lighter than
# the selection background, so it shows on the chosen row too
mid_blue = "#495a80"

[roles]
text = "text"
muted = "subtext0"
line = "surface2"
year_line = "lavender"
label = "lavender"
week_number = "yellow"
week_number_dim = "dim_yellow"
weekend = "blue"
today = "green"
selected = "red"
selection = "dim_mauve"
text_selection = "mid_blue"
focus = "mauve"
checked = "mauve"
notice = "yellow"
error = "red"
# Grid lines: same as v1
grid = "surface0"
other_month = "faint"
# Multi-day bars in the month grid: a tinted band
range = "dim_sapphire"
# Every other line of stacked bars (the 2nd, 4th…): a step lighter, so bars next to each other read as two
range_alt = "mid_sapphire"
# Layout 1's calendar: the underline where two or more multi-day items overlap (the !! color)
range_overlap = "peach"
# Priorities (!!! / !! / !): red, orange, yellow
priority_high = "red"
priority_medium = "peach"
priority_low = "yellow"
# Help page: same as v1
help_section = "blue"
help_key = "peach"
