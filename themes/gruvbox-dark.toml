# Gruvbox Dark: a warm dark theme (common in vim and terminals)
# Palette: dark from https://github.com/morhetz/gruvbox (light shades for text, the bright set for accents)

[palette]
light1 = "#ebdbb2"
light4 = "#a89984"
# Faint gray: text and the background mixed half and half. Dimmer than secondary text, for what
# does not work here (settings rows, help sections)
faint = "#8a826d"
dark1 = "#3c3836"
dark3 = "#665c54"
aqua = "#8ec07c"
blue = "#83a598"
green = "#b8bb26"
yellow = "#fabd2f"
# Dim yellow: yellow and the background (dark0 #282828) mixed 7:3. Still reads as yellow,
# but darker than the selected week's number
dim_yellow = "#bb902d"
orange = "#fe8019"
red = "#fb4934"
# High priority (!!!): red with more light (same hue), so it stands out on the background
bright_red = "#fc6d5c"
purple = "#d3869b"
# Multi-day bars: blue and the background (dark0 #282828) mixed 3:7. A tinted band, dark enough for text on it
dim_blue = "#434e4a"
# Selection background: purple and the background (dark0 #282828) mixed 3:7. A light purple that stands out
# from the background (also a translucent one), dark enough for text on it
dim_purple = "#5b444b"
# Dragged-over text in the day popup: blue (#83a598) and the background (dark0 #282828) mixed 4:6. Lighter
# than the selection background, so it shows on the chosen row too
mid_blue = "#4c5a55"

[roles]
text = "light1"
muted = "light4"
line = "dark3"
year_line = "aqua"
label = "aqua"
week_number = "yellow"
week_number_dim = "dim_yellow"
weekend = "blue"
today = "green"
selected = "red"
selection = "dim_purple"
text_selection = "mid_blue"
focus = "purple"
checked = "purple"
notice = "yellow"
error = "red"
grid = "dark1"
other_month = "faint"
# Multi-day bars in the month grid: a tinted band
range = "dim_blue"
# Every other line of stacked bars (the 2nd, 4th…): a step lighter, so bars next to each other read as two
range_alt = "mid_blue"
# Layout 1's calendar: the underline where two or more multi-day items overlap (the !! color)
range_overlap = "orange"
# Priorities (!!! / !! / !): red, orange, yellow
priority_high = "bright_red"
priority_medium = "orange"
priority_low = "yellow"
help_section = "blue"
help_key = "orange"
