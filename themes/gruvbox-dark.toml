# Gruvbox Dark: a warm dark theme (common in vim and terminals)
# Palette: dark from https://github.com/morhetz/gruvbox (light shades for text, the bright set for accents)

[palette]
light1 = "#ebdbb2"
light4 = "#a89984"
dark1 = "#3c3836"
dark2 = "#504945"
dark3 = "#665c54"
dark4 = "#7c6f64"
aqua = "#8ec07c"
blue = "#83a598"
green = "#b8bb26"
yellow = "#fabd2f"
# Dim yellow: yellow and the background (dark0 #282828) mixed 7:3. Still reads as yellow,
# but darker than the selected week's number
dim_yellow = "#bb902d"
orange = "#fe8019"
red = "#fb4934"
purple = "#d3869b"

[roles]
text = "light1"
muted = "light4"
line = "dark3"
year_line = "aqua"
label = "aqua"
week_number = "yellow"
week_number_dim = "dim_yellow"
weekend = "blue"
has_item = "orange"
today = "green"
selected = "red"
cursor_line = "dark1"
focus = "purple"
checked = "purple"
notice = "yellow"
error = "red"
grid = "dark1"
other_month = "dark4"
# Multi-day bars in the month grid: a step lighter than the selected row
range = "dark2"
help_section = "blue"
help_key = "orange"
