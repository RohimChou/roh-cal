# Nord bright: Nord with more light and color (same hues), for terminals where Nord looks washed out (e.g. on a
# translucent background). Palette: nord1-nord15 from https://www.nordtheme.com, each one lighter and more
# saturated; text is nord6 #eceff4, the brightest of Nord's whites (background: nord0 #2e3440)

[palette]
# Nord's own nord1, not made lighter like the others: the month grid's lines between days stay close to
# the background, so the line where a month ends (nord3) stands out from them
nord1 = "#3b4252"
nord3 = "#55637f"
nord4 = "#eceff4"
# Light gray: nord4 and the background mixed 7:3. Fainter than normal text, for secondary text
nord4_dim = "#b3b7be"
# Faint gray: text and the background mixed half and half. Dimmer than secondary text, for what
# does not work here (settings rows, help sections)
faint = "#8d929a"
nord8 = "#94d1e3"
nord9 = "#8cb0d4"
nord11 = "#d66973"
# High priority (!!!): nord11, vivid (same hue, much more color), so it stands out among the other colors,
# the yellow too
nord11_bright = "#f65e6c"
# Orange (!!): between the !!! red and the yellow, in both color and light
nord12 = "#f59678"
# Yellow: a touch softer than the others (a little less color and light), so it does not outshine the !!! red
nord13 = "#f4d392"
# Dim yellow: nord13 (yellow) and the background mixed 7:3. Still reads as yellow,
# but darker than the selected week's number
nord13_dim = "#b9a379"
# Green: nudged toward a leaf green (a little greener, more color, a touch darker)
nord14 = "#a2d386"
nord15 = "#c69bbe"
# Multi-day bars: nord8 and the background mixed 3:7. A tinted band, dark enough for text on it
nord8_dim = "#4d6371"
# Every other line of stacked multi-day bars: nord8 and the background mixed 4:6. A step lighter than
# nord8_dim, so two bars on lines next to each other read as two
nord8_mid = "#577381"
# The line where the year changes: nord8 and the background mixed 55:45. Still the cyan of the month names,
# but faint, so it marks the year without standing out
nord8_faint = "#668a9a"
# Selection background: nord15 and the background (nord0 #2e3440) mixed 3:7. A light purple that stands out
# from the background (also a translucent one), dark enough for text on it
nord15_dim = "#5c5366"
# Dragged-over text in the day popup: nord9 (#8cb0d4) and the background (nord0 #2e3440) mixed 4:6. Lighter
# than the selection background, so it shows on the chosen row too
nord9_mid = "#54667b"
# The background the colors above are made for (roh-cal does not paint it)
nord0 = "#2e3440"

[roles]
text = "nord4"
muted = "nord4_dim"
line = "nord3"
year_line = "nord8_faint"
label = "nord8"
week_number = "nord13"
week_number_dim = "nord13_dim"
weekend = "nord9"
today = "nord14"
selected = "nord11"
selection = "nord15_dim"
text_selection = "nord9_mid"
# The tab bar's glow fades into the background
background = "nord0"
focus = "nord15"
checked = "nord15"
notice = "nord13"
error = "nord11"
# Month grid lines between days: faint, well below the month's edge (line)
grid = "nord1"
other_month = "faint"
# Multi-day bars in the month grid: a tinted band
range = "nord8_dim"
# Every other line of stacked bars (the 2nd, 4th…): a step lighter, so bars next to each other read as two
range_alt = "nord8_mid"
# Layout 1's calendar: the underline where two or more multi-day items overlap (the !! color)
range_overlap = "nord12"
# Priorities (!!! / !! / !): red, orange, yellow
priority_high = "nord11_bright"
priority_medium = "nord12"
priority_low = "nord13"
help_section = "nord9"
help_key = "nord12"
