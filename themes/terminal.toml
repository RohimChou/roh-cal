# terminal: only the terminal's own 16 colors (they follow the terminal's settings), so it stays readable
# on a terminal with any background
# "reset" = the terminal's default text color; "dark-gray" = the terminal's "bright black"

[roles]
text = "reset"
muted = "dark-gray"
line = "dark-gray"
year_line = "light-blue"
label = "light-blue"
week_number = "yellow"
week_number_dim = "dark-gray"
weekend = "blue"
has_item = "yellow"
holiday = "red"
today = "green"
selected = "red"
cursor_line = "dark-gray"
focus = "magenta"
checked = "magenta"
notice = "yellow"
error = "red"
grid = "dark-gray"
other_month = "dark-gray"
help_section = "blue"
help_key = "yellow"
