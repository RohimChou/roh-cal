# terminal: only the terminal's own 16 colors (they follow the terminal's settings), so it stays readable
# on a terminal with any background
# "reset" = the terminal's default text color; "dark-gray" = the terminal's "bright black"

[roles]
text = "reset"
muted = "dark-gray"
line = "dark-gray"
year_line = "light-blue"
label = "light-blue"
week_number = "yellow"
week_number_dim = "dark-gray"
weekend = "blue"
today = "green"
selected = "red"
# Selection background: the 16 colors have no light purple (magenta would hide the text), so dark-gray
selection = "dark-gray"
focus = "magenta"
checked = "magenta"
notice = "yellow"
error = "red"
grid = "dark-gray"
# Dimmed text (what does not work here): the 16 colors cannot mix the text with the background, so "reset"
# here = the terminal's own faint text (the text color dimmed)
other_month = "reset"
# Multi-day bars in the month grid: dark-gray is taken by the selected row
range = "blue"
# Priorities (!!! / !! / !): the 16 colors have no orange, so the middle one is bright red
priority_high = "red"
priority_medium = "light-red"
priority_low = "yellow"
help_section = "blue"
help_key = "yellow"
