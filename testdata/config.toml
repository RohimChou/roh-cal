# Sample roh-cal v2 config file (the real one lives at ~/.config/roh-cal/config.toml)
# Write only what you want to change; anything left out uses the default. Every setting here differs
# from its default (switches are set to the opposite)

# Colors: the built-in catppuccin-mocha, gruvbox-dark, tokyo-night, dracula, nord (default), one-dark, rose-pine, terminal
# (only the terminal's 16 colors)
theme = "gruvbox-dark"

# The calendars (layouts 1 and 2)
[calendar]
# Week-number column: the selected week shows its week number, other weeks show how many weeks away
# they are (default false)
relative_weeks = true
# Layout 1's calendar: a dot right of each date for each of that day's items (default true)
dots = false

# The month grid (layout 2)
[month]
# Draw faint grid lines between the cells (default true)
grid_lines = false
# Keep the selected week fixed in the middle (default false)
center_cursor = true
# A title too long for its cell runs into the empty cells to its right (default true)
overflow = false

# The calendar list on the far left
[calendar_list]
# Its width, from 22 to 60; left out, it follows the longest calendar name, from 22 up to 38
width = 30
# Hide done tasks (and their subtasks) everywhere; also switched at the bottom of the list (default false)
hide_done = true

# The popup with one day's items (Enter on the calendar)
[day_popup]
# List the items under their outermost calendar's name; when off, one list with each item's outermost
# calendar at its right end (default true)
by_calendar = false

# Override some of the theme's roles (for role names see [roles] in themes/): a color, or a palette
# name from that theme
[colors]
# Weekends use the red from the gruvbox palette
weekend = "red"
