# roh-cal 設定檔範例（真正的位置：~/.config/roh-cal/config.toml）
# 只寫想改的就好，沒寫的用預設值；這裡三個開關都寫成跟預設相反

# 大月曆
[month]
# 格子之間畫淡淡的格線（預設 true）
grid_lines = false
# 每個項目前面加一個點（預設 true）
item_icons = false
# 移動時選取的那週固定在畫面正中間（預設 true）
center_cursor = false

# 改過的顏色（"#rrggbb"）；沒寫的用預設 theme
[colors]
# 星期日改成紅色（Catppuccin red）
sunday = "#f38ba8"
