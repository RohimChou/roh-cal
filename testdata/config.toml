# roh-cal v2 設定檔範例（真正的位置：~/.config/roh-cal/config-v2.toml）
# 只寫想改的就好，沒寫的用預設值；這裡每個開關都寫成跟預設相反

# 月曆（版型 1、3）共用
[calendar]
# 週數欄：選取那週寫週數，其他週寫差幾週（預設 false）
relative_weeks = true

# 大月曆（版型 3）
[month]
# 格子之間畫淡淡的格線（預設 true）
grid_lines = false
# 每件事前面加一個點（預設 true）
item_icons = false
# 選取的那週固定在正中間（預設 false）
center_cursor = true
