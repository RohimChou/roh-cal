[package]
name = "roh-cal"
version = "0.1.0"
edition = "2024"
description = "A simple, keyboard-driven terminal calendar for plain-text tasks"
license = "MIT"
repository = "https://github.com/RohimChou/roh-cal"
readme = "README.md"
keywords = ["calendar", "tui", "tasks", "markdown", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
jiff = "0.2.38"
ratatui = { version = "0.30.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
toml = "1.1.8"
toml_edit = { version = "0.25.17", features = ["serde"] }
tui-input = "0.15.5"
