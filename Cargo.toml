[package]
name = "roh-cal"
version = "0.1.0"
edition = "2024"
description = "A terminal calendar for a plain-text task file"
license = "MIT"
repository = "https://github.com/RohimChou/roh-cal"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
jiff = "0.2.38"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
toml = "1.1.8"
toml_edit = { version = "0.25.17", features = ["serde"] }
tui-input = "0.15.5"
